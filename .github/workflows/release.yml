# Publishes to npm when a version tag (v1.2.3) is pushed: from CI, never from a
# laptop, so each release is built from the tagged commit and carries npm
# provenance linking it there. Uses npm's trusted publishing (no token stored):
# see docs/maintaining.md for setting it up. Then a GitHub Release, with the
# version's notes from CHANGELOG.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: The tag matches the package's version, and is on main
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm run check
      # The first release (0.1.0) is published by hand, before trusted publishing can be set
      # up; its tag still runs this, for the GitHub Release, without publishing it again.
      - name: Already on npm?
        id: published
        run: |
          if npm view "modest-deploy@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then echo "already=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public

  # A GitHub Release for the tag, once it's on npm, with that version's notes from
  # CHANGELOG.md. In a job of its own: the write access it needs is never held
  # while dependencies are installed or the package is published.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release, with the changelog's notes for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## /{if (f) exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
